# Deploys production through a Vercel Deploy Hook on every push to main.
#
# Why: the Vercel project is on the Hobby plan, which can block Git deployments
# when the commit author is not the account owner (for example, a merge done
# by another collaborator). The Deploy Hook builds the latest main regardless.
#
# Setup (once):
#   1. Vercel → effi project → Settings → Git → Deploy Hooks → name "main", branch "main" → Create.
#   2. GitHub → this repo → Settings → Secrets and variables → Actions →
#      New repository secret named VERCEL_DEPLOY_HOOK with the hook URL.
# Without the secret this workflow does nothing.

name: Deploy main via Vercel hook

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-deploy-hook
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pushes by the account owner already deploy through the Vercel Git integration.
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.author.username != 'GolanSH-git'
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK secret is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
          echo "Deploy hook triggered."
